worker_processes auto;
error_log logs/error.log warn;
pid logs/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;

server {
    listen 8080;
    server_name daidai.test;
    #这里的daidai.test 是hosts中配置的本地假域名
    #此域名配置为127.0.0.1 daidai.test
    #请在 C:/windows/system32/drivers/etc/hosts 中修改此配置
    client_max_body_size 100M;

    # 登录端点 - 只允许 POST
    location = /login {
        limit_except POST {
            deny all;
        }
        proxy_pass http://127.0.0.1:6660;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 注册端点 - 只允许 POST
    location = /register {
        limit_except POST {
            deny all;
        }
        proxy_pass http://127.0.0.1:6660;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 发送验证码 - 只允许 POST
    location = /sendVerification {
        limit_except POST {
            deny all;
        }
        proxy_pass http://127.0.0.1:6660;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 校验验证码 - 只允许 POST
    location = /verifyCode {
        limit_except POST {
            deny all;
        }
        proxy_pass http://127.0.0.1:6660;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 其他 API - 根据 RESTful 规范设置
    location /api/ {
        # 根据具体需求限制方法
        limit_except GET POST PUT DELETE {
            deny all;
        }
        proxy_pass http://127.0.0.1:6660;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 前端静态文件 - 只允许 GET
    location / {
        root D:/Code/Maruko/oiwiki/frontend/dist;
        limit_except GET HEAD {
            deny all;
        }
        try_files $uri $uri/ /index.html;
    }
}
}