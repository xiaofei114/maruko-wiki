# 单域名生产环境完整 nginx 主配置
# 用法：替换 /etc/nginx/nginx.conf 前请先备份；如果服务器还有其它站点，
#      请只拷贝本文件中的 server 块到该站点配置，不要整体覆盖。
# 如果使用宝塔 / 1Panel 等面板管理站点，只需拷贝 server 块，证书路径按面板生成的填写。
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # 压缩静态资源
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    # 定义速率限制区域（防暴力破解）
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=verify_limit:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=register_limit:10m rate=5r/m;

    # ============================================================
    # HTTP -> HTTPS 跳转
    # 如果 TLS 在 CDN / 宝塔面板上终止，可删除 443 server，仅保留本段
    # ============================================================
    server {
        listen 80;
        server_name maruko.xiaofei.icu;   # 替换成你的唯一域名

        # 保留 ACME HTTP-01 校验目录，避免证书续期被 301 跳转打断
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/letsencrypt;
            default_type "text/plain";
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name maruko.xiaofei.icu;   # 替换成你的唯一域名

        # 唯一一张证书
        ssl_certificate     /etc/nginx/ssl/maruko.xiaofei.icu.pem;
        ssl_certificate_key /etc/nginx/ssl/maruko.xiaofei.icu.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        client_max_body_size 100M;

        # 安全头部配置
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # ========================================================
        # 静态目录布局（沿用原配置的站点根目录，部署时把两个 dist 拷成下面这样）：
        # /var/www/oiwiki/frontend/dist/         <- frontend/dist 的内容
        # /var/www/oiwiki/frontend/dist/admin/   <- frontend_admin/dist 的内容
        # 如果服务器实际目录不同，只改下面这一行 root 即可
        # ========================================================
        root /var/www/oiwiki/frontend/dist;
        index index.html;

        # ---------------- 根级认证接口 ----------------
        # 这些接口不在 /api 下，必须单独反代，否则会被静态规则拦截成 405
        location = /login {
            limit_req zone=login_limit burst=3 nodelay;
            limit_except POST {
                deny all;
                access_log /var/log/nginx/illegal_requests.log;
            }
            proxy_pass http://127.0.0.1:6660;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Method $request_method;
        }

        location = /sendVerification {
            limit_req zone=verify_limit burst=2 nodelay;
            limit_except POST {
                deny all;
                access_log /var/log/nginx/illegal_requests.log;
            }
            proxy_pass http://127.0.0.1:6660;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /verifyCode {
            limit_req zone=verify_limit burst=2 nodelay;
            limit_except POST {
                deny all;
                access_log /var/log/nginx/illegal_requests.log;
            }
            proxy_pass http://127.0.0.1:6660;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /register {
            limit_req zone=register_limit burst=2 nodelay;
            limit_except POST {
                deny all;
                access_log /var/log/nginx/illegal_requests.log;
            }
            proxy_pass http://127.0.0.1:6660;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 之前漏掉的接口，必须补上，否则重置密码会 405
        location = /resetPassword {
            limit_req zone=register_limit burst=2 nodelay;
            limit_except POST {
                deny all;
                access_log /var/log/nginx/illegal_requests.log;
            }
            proxy_pass http://127.0.0.1:6660;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---------------- API ----------------
        # 注意：proxy_pass 末尾不要加 /，否则会丢掉 /api 前缀导致后端 404
        location /api/ {
            limit_except GET POST PUT DELETE {
                deny all;
                access_log /var/log/nginx/illegal_requests.log;
            }
            proxy_pass http://127.0.0.1:6660;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # 裸 /api 直接返回 404，避免落到前端 index.html
        location = /api {
            return 404;
        }

        # 兼容后端根级的 /file/* 文件路由
        location /file/ {
            limit_except GET HEAD {
                deny all;
                access_log /var/log/nginx/illegal_requests.log;
            }
            proxy_pass http://127.0.0.1:6660;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---------------- 新版管理后台（/admin/） ----------------
        # 补齐结尾斜杠（同源部署，登录态走 localStorage，不需要透传 query）
        location = /admin {
            return 301 /admin/;
        }

        location /admin/ {
            limit_except GET HEAD {
                deny all;
                access_log /var/log/nginx/illegal_requests.log;
            }
            try_files $uri $uri/ /admin/index.html;

            # 管理端静态资源缓存（资源缺失时返回 404，不要回退成 index.html）
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                try_files $uri =404;
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }

        # ---------------- 用户端（/） ----------------
        location / {
            limit_except GET HEAD {
                deny all;
                access_log /var/log/nginx/illegal_requests.log;
            }
            try_files $uri $uri/ /index.html;

            # 用户端静态资源缓存（资源缺失时返回 404，不要回退成 index.html）
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                try_files $uri =404;
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }

        # 健康检查端点（如果需要）
        location /health {
            access_log off;
            default_type text/plain;
            return 200 "healthy\n";
        }

        # 拒绝访问隐藏文件
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
