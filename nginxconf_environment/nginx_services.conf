worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    # 定义速率限制区域（防暴力破解）
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=verify_limit:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=register_limit:10m rate=5r/m;

    server {
        listen 80;
        server_name xxx.xxx.xxx.xxx;
        #此处 xxx.xxx.xxx.xxx为服务器IP地址 请替换为实际服务器IP地址
        #或者修改为你的域名
        client_max_body_size 100M;

        # 安全头部配置
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # 登录端点 - 只允许 POST
        location = /login {
            limit_req zone=login_limit burst=3 nodelay;
            limit_except POST {
                deny all;
                access_log /var/log/nginx/illegal_requests.log;
            }
            proxy_pass http://127.0.0.1:6660;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-Method $request_method;
        }

        # 发送验证码 - 只允许 POST
        location = /sendVerification {
            limit_req zone=verify_limit burst=2 nodelay;
            limit_except POST {
                deny all;
                access_log /var/log/nginx/illegal_requests.log;
            }
            proxy_pass http://127.0.0.1:6660;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 校验验证码 - 只允许 POST
        location = /verifyCode {
            limit_req zone=verify_limit burst=2 nodelay;
            limit_except POST {
                deny all;
                access_log /var/log/nginx/illegal_requests.log;
            }
            proxy_pass http://127.0.0.1:6660;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 注册端点 - 只允许 POST
        location = /register {
            limit_req zone=register_limit burst=2 nodelay;
            limit_except POST {
                deny all;
                access_log /var/log/nginx/illegal_requests.log;
            }
            proxy_pass http://127.0.0.1:6660;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # API 请求 - 根据 RESTful 规范设置允许的方法
        location /api/ {
            # 根据实际需求调整允许的方法
            limit_except GET POST PUT DELETE {
                deny all;
                access_log /var/log/nginx/illegal_requests.log;
            }
            proxy_pass http://127.0.0.1:6660;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 前端静态文件（Vue History 模式）- 只允许 GET 和 HEAD
        location / {
            root /var/www/oiwiki/frontend/dist;
            limit_except GET HEAD {
                deny all;
                access_log /var/log/nginx/illegal_requests.log;
            }
            try_files $uri $uri/ /index.html;
            
            # 静态资源缓存
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }

        # 健康检查端点（如果需要）
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # 拒绝访问隐藏文件
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
EOF