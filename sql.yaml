  permission: 权限 (1:超级管理员, 2:管理员, 3:普通用户)
  is_banned: 是否封禁 (0:否, 1:是)
  is_deleted: 是否删除 (0:否, 1:是)
  bilibili_uid: B站UID
  avatar: 头像文件名（存储在/data/document/avatar目录下）
  fan_level: 粉丝等级
  captain_type: 舰长类型 (0:无, 1:舰长, 2:提督, 3:总督)
