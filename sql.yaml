  create_time: 创建时间


# ==================== 说明 ====================
# gift_type: 礼物类型
#   1 = 舰长礼 (普通舰长可解锁)
#   2 = 提督礼 (提督可解锁)
#   3 = 总督礼 (总督可解锁)
#
# includes: 包含关系 (bitmap)
#   0 = 不包含其他礼物
#   1 = 包含舰长礼 (提督礼/总督礼包含舰长礼)
#   2 = 包含提督礼 (总督礼包含提督礼)
#   3 = 同时包含舰长礼和提督礼 (总督礼包含两者)
#   4 = 包含总督礼 (预留)
#
# show_progress: 是否显示进度条
#   0 = 不显示进度条 (如总督礼、提督礼通常不显示)
#   1 = 显示进度条 (如舰长礼通常显示)
#
# is_review: 审核状态
#   0 = 未审核/待审核
#   1 = 审核通过/已通过
#   2 = 审核不通过/已拒绝
#
# 使用示例:
# 1. 基础舰长礼: gift_type=1, includes=0, show_progress=1
# 2. 提督礼(包含舰长礼): gift_type=2, includes=1, show_progress=0
# 3. 总督礼(包含提督和舰长): gift_type=3, includes=3, show_progress=0
# 4. 特殊提督礼(不包含舰长礼): gift_type=2, includes=0, show_progress=0
# 5. 带进度条的总督礼: gift_type=3, includes=3, show_progress=1
